---
###############################################################################
# Helm
###############################################################################

helm_version: "v3.19.0"

###############################################################################
# Cilium
###############################################################################

cilium_version: "1.18.0"

###############################################################################
# Kubernetes API
###############################################################################

k8s_service_host: "{{ hostvars[groups['servers'][0]].ansible_host }}"

k8s_service_port: 6443

###############################################################################
# Cilium Features
###############################################################################

cilium_kube_proxy_replacement: true

cilium_hubble_enabled: true

cilium_prometheus_enabled: false

###############################################################################
# Networking
###############################################################################

cilium_routing_mode: native

cilium_ipv4_native_routing_cidr: "10.42.0.0/16"

cilium_auto_direct_node_routes: true