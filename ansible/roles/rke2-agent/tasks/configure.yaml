---
###############################################################################
# Configure RKE2
###############################################################################

- name: Create configuration directory
  file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Deploy config.yaml
  template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0644"