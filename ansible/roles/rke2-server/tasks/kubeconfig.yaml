---
###############################################################################
# Configure kubectl for the vagrant user
#
# Copia el kubeconfig generado por RKE2 al usuario vagrant para que pueda
# administrar el clúster sin utilizar sudo.
###############################################################################

- name: Wait until kubeconfig exists
  wait_for:
    path: /etc/rancher/rke2/rke2.yaml
    timeout: 300

- name: Create .kube directory
  file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

- name: Copy kubeconfig
  copy:
    src: /etc/rancher/rke2/rke2.yaml
    dest: /home/vagrant/.kube/config
    owner: vagrant
    group: vagrant
    mode: "0600"
    remote_src: true

- name: Replace localhost with master IP
  replace:
    path: /home/vagrant/.kube/config
    regexp: '127\.0\.0\.1'
    replace: "{{ ansible_host }}"

- name: Add RKE2 binaries to PATH
  copy:
    dest: /etc/profile.d/rke2.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      export PATH=$PATH:/var/lib/rancher/rke2/bin