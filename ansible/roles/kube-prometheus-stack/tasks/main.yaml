---
###############################################################################
# Copy Helm values
###############################################################################

- name: Copy kube-prometheus-stack values
  template:
    src: values.yaml.j2
    dest: /tmp/kube-prometheus-values.yaml
    mode: "0644"

###############################################################################
# Add Helm repository
###############################################################################

- name: Add Prometheus Community repository
  command: >
    /usr/local/bin/helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  changed_when: false

###############################################################################
# Update repositories
###############################################################################

- name: Update Helm repositories
  command: /usr/local/bin/helm repo update
  changed_when: false

###############################################################################
# Install kube-prometheus-stack
###############################################################################

- name: Install kube-prometheus-stack
  command: >
    /usr/local/bin/helm upgrade
    --install kube-prometheus-stack
    prometheus-community/kube-prometheus-stack
    --namespace {{ prometheus_namespace }}
    --create-namespace
    --version {{ kube_prometheus_stack_version }}
    --values /tmp/kube-prometheus-values.yaml
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml

###############################################################################
# Wait Prometheus
###############################################################################

- name: Wait Prometheus
  command: >
    /var/lib/rancher/rke2/bin/kubectl rollout status
    statefulset/prometheus-kube-prometheus-stack-prometheus
    -n {{ prometheus_namespace }}
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  register: prometheus_status
  retries: 30
  delay: 10
  until: prometheus_status.rc == 0
  changed_when: false

###############################################################################
# Wait Grafana
###############################################################################

- name: Wait Grafana
  command: >
    /var/lib/rancher/rke2/bin/kubectl rollout status
    deployment/kube-prometheus-stack-grafana
    -n {{ prometheus_namespace }}
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  register: grafana_status
  retries: 30
  delay: 10
  until: grafana_status.rc == 0
  changed_when: false

###############################################################################
# Show Pods
###############################################################################

- name: Show monitoring pods
  command: >
    /var/lib/rancher/rke2/bin/kubectl get pods -n {{ prometheus_namespace }}
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  changed_when: false

###############################################################################
# Show Services
###############################################################################

- name: Show monitoring services
  command: >
    /var/lib/rancher/rke2/bin/kubectl get svc -n {{ prometheus_namespace }}
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  changed_when: false