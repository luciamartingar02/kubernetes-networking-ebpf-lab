apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: networking-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - /bin/sh
        - -c
        - |
          echo "<h1>${POD_NAME}</h1>" > /usr/share/nginx/html/index.html
          nginx -g 'daemon off;'